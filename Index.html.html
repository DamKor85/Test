<style>

:root{--bg:#E8EEF1;--panel:#FFFFFF;--tint:#F2F6F8;--ink:#10202A;--mute:#53666F;--line:#C9D5DC;--accent:#165C8D;--accent-ink:#FFFFFF;--good:#17754F;--bad:#BF352B;--me:#FFEFB0;--ring:#10202A;--hit:#FFFFFF;--miss:#10202A;--gold:#B8921C;--silver:#7C8A93;--bronze:#A8672F;--fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Public Sans',system-ui,sans-serif}

.shell .ev span:nth-child(2){white-space:normal;min-width:0}

h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px;line-height:1.1;text-wrap:balance}
h1{font-size:34px}h2{font-size:26px}h3{font-size:19px;color:var(--mute)}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 10px;border-bottom:2px solid var(--ink);margin-bottom:16px}

.prog{display:flex;gap:3px;padding:10px 14px 0;flex-wrap:wrap}.prog span{height:8px;width:26px;background:var(--line)}.prog span.sh{width:14px;border-top:3px solid var(--bad);height:8px}.prog span.d{background:var(--accent)}.prog span.sh.d{background:var(--accent);border-top-color:var(--bad)}
.hud-b{display:flex;gap:22px;align-items:center;padding:14px;flex-wrap:wrap}

.targets{display:flex;gap:10px;margin:10px 0}.disc{width:34px;height:34px;border-radius:50%;border:3px solid var(--ring)}.disc.h{background:var(--hit)}.disc.m{background:var(--miss)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}.acts .btn{flex:1 1 150px;text-align:center}.acts .btn small{display:block;font:400 12px var(--fb);letter-spacing:0;text-transform:none;opacity:.85}
.mini{padding:0 14px 14px}

@media (max-width:520px){h1{font-size:28px}.rank b{font-size:84px}.stat{grid-template-columns:110px 1fr 34px}}

<main id="app"></main>
<script>
'use strict';
/* ===== Narzędzia ===== */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wpick=(it,w)=>{let r=Math.random()*w.reduce((x,y)=>x+y,0);for(let i=0;i<it.length;i++){r-=w[i];if(r<=0)return it[i]}return it[it.length-1]};

/* ===== Dane ===== */
const STATS=[
['end','Wytrzymałość','Dłużej utrzymujesz tempo i szybciej dochodzisz do siebie przed strzelnicą.'],
['tech','Technika biegu','Szybciej pokonujesz pętlę przy tym samym wysiłku.'],
['str','Siła','Siła rąk i tułowia: odbicia kijkami, podbiegi.'],
['prone','Strzelanie leżąc','Celność w pozycji leżącej.'],
['stand','Strzelanie stojąc','Celność w pozycji stojącej, zwykle trudniejsza.'],
['tempo','Tempo na strzelnicy','Krócej stoisz na strzelnicy.'],
['ment','Odporność psychiczna','Lepiej strzelasz pod presją: ostatnie strzelanie, mistrzostwa, igrzyska.']];
const SL=Object.fromEntries(STATS.map(s=>[s[0],s[1]]));
const COUNTRIES=[
{c:'NOR',n:'Norwegia',t:1,g:'nor',d:'Potęga biathlonu. Najlepsze zaplecze, ale o miejsce w kadrze trzeba bić się z dziesiątkami talentów.'},
{c:'FRA',n:'Francja',t:1,g:'fra',d:'Świetna szkoła strzelecka i silny sztab. Kadra bardzo liczna.'},
{c:'GER',n:'Niemcy',t:1,g:'ger',d:'Wiele ośrodków i trenerów, a konkurencja w kadrze ogromna.'},
{c:'SWE',n:'Szwecja',t:1,g:'nor',d:'Długa tradycja, dobre warunki treningowe i mocna konkurencja.'},
{c:'ITA',n:'Włochy',t:2,g:'ita',d:'Trasy w Południowym Tyrolu i dobry system juniorski.'},
{c:'AUT',n:'Austria',t:2,g:'ger',d:'Solidne zaplecze i wyrównana kadra.'},
{c:'CZE',n:'Czechy',t:2,g:'sla',d:'Stabilna kadra z długą tradycją.'},
{c:'SUI',n:'Szwajcaria',t:2,g:'ger',d:'Mała, ale dobrze zorganizowana reprezentacja.'},
{c:'UKR',n:'Ukraina',t:2,g:'sla',d:'Utalentowani zawodnicy, trudniejsze warunki do pracy.'},
{c:'USA',n:'USA',t:2,g:'eng',d:'Niewielka kadra, łatwiej o start, trudniej o zaplecze.'},
{c:'FIN',n:'Finlandia',t:2,g:'fin',d:'Dobre warunki biegowe i spokojna rywalizacja o miejsce.'},
{c:'POL',n:'Polska',t:3,g:'sla',d:'Skromniejsze zaplecze, za to mała konkurencja o miejsce w kadrze. Większość drogi przejdziesz własną pracą.'},
{c:'SVK',n:'Słowacja',t:3,g:'sla',d:'Mała kadra i ośrodek w Osrblie. Szansa na szybki awans.'},
{c:'SLO',n:'Słowenia',t:3,g:'sla',d:'Kadra niewielka, treningi w Pokljuce.'},
{c:'BUL',n:'Bułgaria',t:3,g:'sla',d:'Skromne warunki, mało rywali o miejsce w kadrze.'},
{c:'EST',n:'Estonia',t:3,g:'fin',d:'Mała reprezentacja z ambicjami.'},
{c:'LAT',n:'Łotwa',t:3,g:'fin',d:'Niewielka kadra, kilka mocnych nazwisk.'},
{c:'CAN',n:'Kanada',t:3,g:'eng',d:'Kadra niewielka, długie podróże na starty.'}];
const cof=c=>COUNTRIES.find(x=>x.c===c);
const NM={
nor:{m:['Eirik','Sander','Halvor','Tobias','Magnus','Henrik','Anders','Kristian'],f:['Ingrid','Sigrid','Thea','Marit','Silje','Hanne','Live','Astrid'],s:['Aasland','Brekke','Dalen','Fjeld','Haugen','Lundgren','Moen','Strand','Tveit','Vik']},
ger:{m:['Lukas','Jonas','Felix','Moritz','Paul','Niklas','Tim','Leon'],f:['Lena','Anna','Mia','Johanna','Clara','Nele','Hannah','Greta'],s:['Brandt','Köhler','Lange','Meißner','Neumann','Roth','Seidel','Voigt','Wendt','Zimmer']},
fra:{m:['Antoine','Julien','Mathis','Hugo','Théo','Baptiste','Lucas','Romain'],f:['Camille','Chloé','Manon','Léa','Océane','Louise','Jade','Clémence'],s:['Berthier','Carrel','Duval','Garnier','Lambert','Morel','Perrin','Roux','Vidal','Blanc']},
ita:{m:['Matteo','Luca','Marco','Davide','Simone','Andrea','Fabio','Nicola'],f:['Giulia','Sofia','Chiara','Elena','Martina','Sara','Alice','Federica'],s:['Bertolini','Costa','De Luca','Ferrari','Galli','Moretti','Pellegrini','Rinaldi','Santoro','Villa']},
sla:{m:['Marek','Tomasz','Jakub','Piotr','Ondřej','Andrij','Matej','Jan','Bartosz','Pavel'],f:['Anna','Kateřina','Marta','Oksana','Zuzana','Natalia','Ewa','Petra','Magda','Irena'],s:['Novák','Kowal','Horvat','Kovač','Bondar','Tkach','Zelenka','Marek','Petrov','Krejčí']},
eng:{m:['Ethan','Caleb','Owen','Logan','Tyler','Garrett','Noah','Eli'],f:['Emma','Hailey','Claire','Megan','Paige','Rachel','Nora','Tessa'],s:['Hawkins','Brooks','Callahan','Dawson','Ellis','Fletcher','Harper','Mercer','Sutton','Whitaker']},
fin:{m:['Eetu','Mikko','Olli','Jussi','Tuomas','Aleksi','Ville','Joonas'],f:['Aino','Elina','Heidi','Venla','Noora','Sanna','Tiia','Katja'],s:['Hakala','Järvinen','Koskinen','Lehtonen','Mäkelä','Nieminen','Ojala','Rantanen','Salminen','Virtanen']}};

const FORMATS={
sprint:{k:'sprint',n:'Sprint',km:[10,7.5],base:[1380,1160],loops:3,shoots:['P','S'],pen:'loop',info:'Dwa strzelania: leżąc i stojąc. Za każde pudło rundka karna 150 m.'},
pursuit:{k:'pursuit',n:'Bieg pościgowy',km:[12.5,10],base:[1650,1480],loops:5,shoots:['P','P','S','S'],pen:'loop',info:'Start z różnicami czasowymi ze sprintu. Awansuje 60 najlepszych. Cztery strzelania, rundki karne.'},
individual:{k:'individual',n:'Bieg indywidualny',km:[20,15],base:[2600,2190],loops:5,shoots:['P','S','P','S'],pen:'min',info:'Start co 30 sekund, cztery strzelania. Za każde pudło minuta kary doliczona do czasu.'},
mass:{k:'mass',n:'Bieg masowy',km:[15,12.5],base:[1950,1820],loops:5,shoots:['P','P','S','S'],pen:'loop',info:'Wspólny start 30 najlepszych z klasyfikacji. Cztery strzelania, rundki karne.'}};

const LEVELS=[
{n:'Puchar Juniorów IBU',s:'Juniorzy',N:59,mu:44,sd:9,cw:[2,2,2],cut:48,chR:['sprint','pursuit','individual'],xp:5,v:['Obertilliach','Ridnaun','Brezno-Osrblie','Arber','Martell','Lenzerheide']},
{n:'Puchar IBU',s:'Puchar IBU',N:79,mu:56,sd:8,cw:[2.5,3,2],cut:60,chR:['sprint','pursuit','mass'],xp:9,v:['Sjusjøen','Idre Fjäll','Arber','Martell','Ridnaun','Brezno-Osrblie']},
{n:'Puchar Świata',s:'Puchar Świata',N:99,mu:66,sd:10,cw:[5,3,1.5],cut:75,chR:['sprint','pursuit','individual','mass'],xp:14,v:['Östersund','Hochfilzen','Le Grand-Bornand','Oberhof','Ruhpolding','Antholz-Anterselva']}];

const sLabel=y=>y+'/'+String(y+1).slice(2);
const isOly=y=>y+1>=2030&&(y+1-2030)%4===0;
const champName=S=>S.level===2?(isOly(S.year)?'Igrzyska Olimpijskie '+(S.year+1):'Mistrzostwa Świata '+(S.year+1)):S.level===1?'Mistrzostwa Europy '+(S.year+1):'Mistrzostwa Świata Juniorów '+(S.year+1);

/* ===== Zawodnicy ===== */
function genField(level,gender){const LV=LEVELS[level],f=[],used=new Set();
 for(let i=1;i<=LV.N;i++){
  const co=wpick(COUNTRIES,COUNTRIES.map(c=>LV.cw[c.t-1])),P=NM[co.g];let nm,tr=0;
  do{nm=pick(gender?P.f:P.m)+' '+pick(P.s)}while(used.has(nm)&&++tr<8);used.add(nm);
  const r=clamp(LV.mu+gauss()*LV.sd,15,95),q=()=>clamp(r+gauss()*6,10,99);
  f.push({id:i,name:nm,co:co.c,end:q(),tech:q(),str:q(),prone:clamp(r+gauss()*7,10,99),stand:clamp(r-4+gauss()*7,10,99),tempo:q(),ment:q(),form:50+gauss()*5})}
 return f}
const meAth=G=>({id:0,me:1,name:G.name,co:G.country,...G.stats,ment:G.stats.ment+Math.min(10,G.exp/60),form:G.form});
const skiPow=a=>.5*a.end+.32*a.tech+.18*a.str;

/* ===== Symulacja biegu ===== */
const EFF={easy:{m:1.028,f:.02},norm:{m:1,f:.07},hard:{m:.972,f:.14}};
const newSt=a=>({a,t:0,fat:0,miss:[],hits:[],nz:gauss()*.008,rf:a.form+gauss()*6});
function skiLoop(st,F,ctx,eff){const a=st.a,e=EFF[eff];
 const T=F.base[ctx.g]/F.loops*(1-(skiPow(a)-60)*.0017)*(1-(st.rf-50)*.0008)*(1+st.nz)*(1+gauss()*.0035)*e.m*(1+Math.max(0,st.fat-.5)*.05);
 st.fat=clamp(st.fat+e.f*(1.3-a.end/100*.7),0,1);st.t+=T;return T}
function shoot(st,F,ctx,k,style){const a=st.a,pos=F.shoots[k],acc=pos==='P'?a.prone:a.stand,press=ctx.champ||k===F.shoots.length-1;
 let p=.5+.46*Math.pow(clamp(acc,0,100)/100,1.15);
 p-=st.fat*.13;p+=(a.ment-50)*(press?.0007:.0003);
 p+=style==='safe'?.05:style==='fast'?-.07:0;
 p-=ctx.wind*(pos==='S'?.006:.003)*(.7+Math.random()*.6);
 p=clamp(p,.3,.985);
 const hits=[];let miss=0;for(let j=0;j<5;j++){const h=Math.random()<p;hits.push(h);if(!h)miss++}
 const rt=(pos==='P'?25:30)*(1.1-a.tempo*.0025)+(style==='safe'?5:style==='fast'?-4:0)+gauss()*1.2+miss*1.2;
 const pen=F.pen==='min'?60*miss:miss*clamp(25+(80-skiPow(a))*.05,22,30);
 st.t+=rt+pen;st.fat=clamp(st.fat-.05,0,1);st.miss.push(miss);st.hits.push(hits);
 return{hits,miss,rt,pen,pos,p}}
function simRival(a,off,F,ctx){const st=newSt(a),o=F.k==='pursuit'?off:0,t=[];
 for(let i=0;i<F.loops;i++){skiLoop(st,F,ctx,wpick(['easy','norm','hard'],[.15,.7,.15]));
  if(i<F.shoots.length){t.push(st.t+o);shoot(st,F,ctx,i,wpick(['safe','norm','fast'],[.12,.76,.12]));t.push(st.t+o)}}
 t.push(st.t+o);return{a,off:o,t,miss:st.miss}}

function cupTable(G,k){const S=G.S,P=k?((S.cupK||{})[k]||{}):S.cup;
 return[{id:0,name:G.name,co:G.country,me:1,pts:P[0]||0},...S.field.map(r=>({id:r.id,name:r.name,co:r.co,pts:P[r.id]||0}))]
 .sort((a,b)=>b.pts-a.pts||(a.me?1:0)-(b.me?1:0)||a.id-b.id)}
const myRank=G=>cupTable(G).findIndex(x=>x.me)+1;

function startList(G,S,ev){
 let all=[meAth(G),...S.field];
 if(ev.champ&&S.champ)all=all.filter(a=>S.champ.includes(a.id));
 if(ev.k==='pursuit'){const src=S.cal[ev.src].full||[],top=src.slice(0,60);
  if(!top.length)return{skip:'Brak wyników sprintu.'};
  if(!top.some(x=>x.id===0))return{skip:`Nie awansowałeś do pościgu: ${src.findIndex(x=>x.id===0)+1}. miejsce w sprincie, awansuje 60 najlepszych.`};
  const w=top[0].t;return{list:top.map(x=>({a:all.find(y=>y.id===x.id),off:x.t-w}))}}

 if(S.phase==='done'){nxt=`<h3>Koniec sezonu</h3><p>${esc(S.champMsg||'Wszystkie starty za Tobą.')}</p><div class="row"><button class="btn pri" data-act="endseason">Podsumowanie sezonu</button></div>`}
 else{const F=FORMATS[ev.k];nxt=`<h3>${S.phase==='champ'?esc(S.champName):'Następne zawody'}</h3><h2>${esc(ev.v)} · ${F.n}</h2><p>${F.km[G.gender]} km · ${F.info}</p>
 <div class="row"><button class="btn pri" data-act="race">Start krok po kroku</button><button class="btn" data-act="quick">Symuluj te zawody</button><button class="btn" data-act="block">Symuluj do końca etapu</button></div>`}
 const h=G.hist.length?`<details class="card"><summary>Historia kariery</summary><div class="sc"><table class="tbl"><tr><th>Sezon</th><th>Wiek</th><th>Liga</th><th>Klasyf.</th><th class="r">Pkt</th><th>Najlepszy</th><th>Mistrzostwa</th></tr>${G.hist.map(r=>`<tr><td>${sLabel(r.y)}</td><td>${r.age}</td><td>${LEVELS[r.lv].s}</td><td>${r.rk}/${r.n}</td><td class="r">${r.pts}</td><td>${r.best||'—'}</td><td>${esc(r.champ||'—')}</td></tr>`).join('')}</table></div></details>`:'';
 put(shell(`${S.note&&S.noteAt===S.i?`<div class="note"><b>Trening zakończony.</b> ${S.note.map(n=>esc(n[0])+' '+esc(n[1])).join(' · ')}</div>`:''}${S.msg&&S.phase!=='train2'?`<div class="note">${esc(S.msg)}</div>`:''}
 <div class="card">${nxt}</div>
 <div class="card"><h3>Zawodnik · ${esc(G.name)}</h3>${bars()}<div class="row small mute"><span>Forma: <b>${G.form.toFixed(0)}</b></span><span>Doświadczenie: <b>${G.exp}</b> pkt</span><span>Zwycięstwa: <b>${G.wins}</b></span><span>Podia: <b>${G.pod}</b></span><span>Medale: <b>${G.medals.length}</b></span><span>Kule: duże <b>${G.globes}</b>, małe <b>${(G.small||[]).length}</b></span></div>${shStats()}</div>${h}
 ${G.age>=27?'<p><button class="btn" data-act="retire">Zakończ karierę</button></p>':''}`),1)}

/* --- zawody --- */
function prog(x,fin){let h='',d=x.loop+x.shot+(fin?1:0),n=0;for(let i=0;i<x.F.loops;i++){h+=`<span class="${n++<d?'d':''}"></span>`;if(i<x.F.shoots.length)h+=`<span class="sh ${n++<d?'d':''}"></span>`}return`<div class="prog">${h}</div>`}
function mini(L,n){const me=L.findIndex(r=>r.a.me),show=new Set([0,1,2]);for(let i=me-3;i<=me+3;i++)if(i>=0&&i<L.length)show.add(i);if(n)for(let i=0;i<n;i++)show.add(i);
 let h='',last=-1;[...show].sort((a,b)=>a-b).forEach(i=>{if(last>=0&&i>last+1)h+='<tr class="gap"><td colspan="5">···</td></tr>';last=i;const r=L[i];h+=`<tr class="${r.a.me?'me':''}"><td>${r.rank}</td><td>${esc(r.a.name)}</td><td>${r.a.co}</td><td>${r.m.length?miss(r.m):'—'}</td><td class="r">${r.rank===1?fT(r.t):fG(r.gap)}</td></tr>`});
 return fieldInfo(L)+`<div class="sc"><table class="tbl"><tr><th>#</th><th>Zawodnik</th><th>Kraj</th><th>Pudła</th><th class="r">Czas</th></tr>${h}</table></div>`}
function fieldInfo(L){const n=L[0].m.length;if(!n)return'';const N=L.length,tot=L.reduce((a,r)=>a+r.m.reduce((x,y)=>x+y,0),0),acc=Math.round((1-tot/(5*n*N))*100),clean=L.filter(r=>r.m.every(x=>!x)).length,lm=L.reduce((a,r)=>a+r.m[n-1],0),la=Math.round((1-lm/(5*N))*100),c1=L.filter(r=>!r.m[n-1]).length;
 return`<p class="small mute">Stawka po ${n} strzel.: <b>${acc}%</b> trafień · bez pudła do tej pory: <b>${clean}</b> z ${N}. Ostatnie strzelanie: <b>${la}%</b> trafień, ${c1} zawodników bez pudła.</p>`}
function raceStart(){const S=G.S,ev=S.cal[S.i],x=openRace(G,S,ev);
 if(x.skip){ev.res={skip:x.skip};advance(G);R=null;put(`<div class="card"><h2>Bez startu</h2><p>${esc(x.skip)}</p><button class="btn pri" data-act="hub">Wróć do kalendarza</button></div>`);return}
 R={x,ph:'intro',last:null};vRace()}
function vRace(){const x=R.x,F=x.F,ev=x.ev,ph=R.ph,g=G.gender;
 const head=`<div class="hud-h"><span>${esc(ev.v)} · ${F.n}</span><span>${F.km[g]} km · wiatr ${x.ctx.wind.toFixed(1)} m/s</span></div>`;
 let body='';
 if(ph==='intro'){
  let st=`Na liście startowej: ${x.n} zawodników.`;
  if(F.k==='pursuit'){const pos=x.riv.filter(r=>r.off<x.me.off).length+1;st=`Startujesz z ${pos}. pozycji, ze stratą ${fG(x.me.off)} do lidera. ${x.n} zawodników.`}
  if(F.k==='mass')st=`Wspólny start. Jesteś w gronie 30 najlepszych z klasyfikacji (${myRank(G)}. miejsce).`;
  body=`<div class="hud-b"><div class="info"><div class="big">${esc(G.name)} · ${G.country}</div><p>${F.info}</p><p>${st}</p>${ev.champ?'<p><b>Wielka stawka.</b> Na mistrzostwach liczy się odporność psychiczna.</p>':''}</div></div><div class="acts"><button class="btn pri" data-act="go">Start</button></div>`}
 else{
  const cp=ph==='arr'?2*x.shot:ph==='res'?2*(x.shot-1)+1:ph==='fin'?2*F.shoots.length:null;
  const L=cp==null?null:rankAt(x,cp),m=L&&L.find(r=>r.a.me);
  const lastTxt=R.last?`Poprzedni punkt: ${R.last}. miejsce`:'';
  const pos=m?m.rank:(R.last||'–');
  const stage=ph==='arr'?`Wbiegasz na strzelnicę (${F.shoots[x.shot]==='P'?'leżąc':'stojąc'})`:ph==='res'?'Wybiegasz ze strzelnicy':ph==='fin'?'Meta':`Pętla ${x.loop+1} z ${F.loops}`;
  let mid='';
  if(ph==='res'){const r=R.sh;mid=`<div class="targets">${r.hits.map(h=>`<span class="disc ${h?'h':'m'}"></span>`).join('')}</div><p>${r.miss?`Pudła: <b>${r.miss}</b>. ${F.pen==='min'?'Kara: +1:00 za każde pudło ('+r.miss+' min).':`Rundki karne: ${r.miss} (+${r.pen.toFixed(0)} s).`}`:'<b>Komplet trafień.</b> Bez kary.'} Czas na strzelnicy: ${r.rt.toFixed(0)} s.</p>`}
  if(ph==='eff')mid=`<p>Wybierz tempo na tej pętli.</p>`;
  if(m&&ph!=='fin')mid+=`<div class="big">${m.rank===1?'Prowadzisz':'Strata '+fT(m.gap)}</div><div class="small mute">${lastTxt}</div>`;
  if(ph==='fin'){const o=R.out,r=ev.res;const pp=pos=>{let h=0,n=0;x.me.st.hits.forEach((hh,k)=>{if(F.shoots[k]===pos){h+=hh.filter(Boolean).length;n+=5}});return n?h+'/'+n:'—'};mid=`<div class="big">${r.place===1?'Czas '+fT(r.time):'Strata '+fT(r.gap)+' · czas '+fT(r.time)}</div><p>Pudła: <b>${miss(r.miss)}</b> (${r.miss.reduce((a,b)=>a+b,0)}) · Leżąc: <b>${pp('P')}</b> · Stojąc: <b>${pp('S')}</b> ${ev.champ?'':`· Punkty do klasyfikacji: <b>${r.pts}</b>`} · Doświadczenie: <b>+${o.xp}</b></p>${ev.champ&&r.place<=3?`<p class="medal ${['g','s','b'][r.place-1]}">Medal! ${['Złoto','Srebro','Brąz'][r.place-1]}</p>`:r.place===1?'<p class="medal g">Zwycięstwo!</p>':''}`}
  let acts='';
  if(ph==='eff'){const last=x.loop===F.loops-1;acts=[['easy','Oszczędzaj',last?'spokojny finisz':'mniej zmęczenia przed strzelnicą'],['norm','Równe tempo','bezpieczny wybór'],['hard','Atakuj',last?'wszystko na metę':'szybciej, ale gorsza celność']].map(a=>`<button class="btn${a[0]==='norm'?' pri':''}" data-act="eff" data-v="${a[0]}">${a[1]}<small>${a[2]}</small></button>`).join('')}
  if(ph==='arr')acts=[['safe','Spokojnie','celniej, ale dłużej'],['norm','Normalnie','standardowy rytm'],['fast','Szybko','krócej, ale ryzykownie']].map(a=>`<button class="btn${a[0]==='norm'?' pri':''}" data-act="shoot" data-v="${a[0]}">${a[1]}<small>${a[2]}</small></button>`).join('');
  if(ph==='res')acts='<button class="btn pri" data-act="next">Dalej</button>';
  if(ph==='fin')acts='<button class="btn pri" data-act="hub">Wróć do kalendarza</button>';
  body=`${prog(x,ph==='fin')}<div class="hud-b"><div class="rank"><small>${ph==='eff'?'ostatnio':'miejsce'}</small><b>${pos}</b><small>z ${x.n}</small></div><div class="info"><h3 style="margin:0 0 4px">${stage}</h3>${mid}</div></div><div class="acts">${acts}</div>${L?`<div class="mini">${mini(L,ph==='fin'?10:0)}</div>`:''}`}
 put(shell(`<div class="hud">${head}${body}</div>`),1)}

/* --- sezon / koniec --- */
function vSeason(){const s=G.sum,r=s.rec;
 put(`<section class="card"><h2>Podsumowanie sezonu ${sLabel(r.y)}</h2>${s.lines.map(l=>`<p>${esc(l)}</p>`).join('')}
 <div class="row small mute"><span>Zwycięstwa: <b>${G.wins}</b></span><span>Podia: <b>${G.pod}</b></span><span>Medale: <b>${G.medals.length}</b></span><span>Kryształowe Kule: <b>${G.globes}</b></span><span>Małe kule: <b>${(G.small||[]).length}</b></span></div>
 <p style="margin-top:14px"><button class="btn pri" data-act="nextseason">${G.over?'Dalej':'Następny sezon'}</button></p></section>`)}
function vOver(){const m=G.medals;wipe();
 put(`<section class="card"><h1>Koniec kariery</h1><p class="lead">${esc(G.over.reason)}</p>
 <p>${esc(G.name)} (${G.country}) · ${G.hist.length} sezonów · ${G.starts} startów · zwycięstwa: <b>${G.wins}</b> · podia: <b>${G.pod}</b> · Kryształowe Kule: <b>${G.globes}</b> · małe kule: <b>${(G.small||[]).length}</b></p>
 <h3>Medale mistrzostw</h3>${m.length?m.map(x=>`<p><span class="medal ${['g','s','b'][x.place-1]}">${['Złoto','Srebro','Brąz'][x.place-1]}</span> · ${esc(x.ev)} · ${x.race}</p>`).join(''):'<p class="mute">Bez medalu na wielkiej imprezie. Następnym razem się uda.</p>'}
 <div class="sc"><table class="tbl"><tr><th>Sezon</th><th>Wiek</th><th>Liga</th><th>Klasyf.</th><th>Mistrzostwa</th></tr>${G.hist.map(r=>`<tr><td>${sLabel(r.y)}</td><td>${r.age}</td><td>${LEVELS[r.lv].s}</td><td>${r.rk}/${r.n}</td><td>${esc(r.champ||'—')}</td></tr>`).join('')}</table></div>
 <p style="margin-top:14px"><button class="btn pri" data-act="restart">Nowa kariera</button></p></section>`)}
function go(){if(G.over)return vOver();const ph=G.S.phase;if(ph==='train1'||ph==='train2'){TR={main:null,sec:null};vTrain()}else vHub()}

/* --- zdarzenia --- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(a==='pick'){SEL[d.k]=d.k==='g'?+d.v:d.v;b.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));if(d.k==='co')cdesc();return}
 if(a==='new'){G=newGame({name:$('#nm').value.trim().slice(0,28),g:SEL.g,co:SEL.co,prof:SEL.prof});return go()}
 if(a==='cont'){G=load();return go()}
 if(a==='tr'){const o=d.w==='main'?'sec':'main';if(TR[o]===d.k)TR[o]=null;TR[d.w]=TR[d.w]===d.k?null:d.k;return vTrain()}
 if(a==='traindo'){const out=doTraining(G,TR.main,TR.sec);G.S.note=out;G.S.noteAt=G.S.i;return vHub()}
 if(a==='ct'){CT=d.v;const el=$('#cupbox');if(el)el.innerHTML=cupBox();return}
 if(a==='hub')return go();
 if(a==='race')return raceStart();
 if(a==='quick'){playQuick(G);return go()}
 if(a==='block'){playBlock(G);return go()}
 if(a==='go'){R.ph='eff';return vRace()}
 if(a==='eff'){const x=R.x;R.last=R.last;const s=mySki(x,d.v);if(s==='fin'){R.out=finish(G,G.S,x);advance(G);R.ph='fin'}else R.ph='arr';return vRace()}
 if(a==='shoot'){const x=R.x,L=rankAt(x,2*x.shot);R.arrive=L.find(r=>r.a.me).rank;R.sh=myShoot(x,d.v);R.ph='res';return vRace()}
 if(a==='next'){const L=rankAt(R.x,2*(R.x.shot-1)+1);R.last=L.find(r=>r.a.me).rank;R.ph='eff';return vRace()}
 if(a==='endseason'){endSeason(G);save();return vSeason()}
 if(a==='nextseason')return go();
 if(a==='retire'){if(b.dataset.sure){retire(G);return vOver()}b.dataset.sure=1;b.textContent='Na pewno? Kliknij jeszcze raz';return}
 if(a==='restart'){G=null;R=null;return vStart()}});
vStart();
</script>

</body></html>
